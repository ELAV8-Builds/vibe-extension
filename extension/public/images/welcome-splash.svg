<svg width="280" height="200" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#7c3aed" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="3"/>
      <feFlood flood-color="#06b6d4" flood-opacity="0.4"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer orbit ring -->
  <ellipse cx="140" cy="100" rx="120" ry="80" fill="none" stroke="url(#ring1)" stroke-width="0.5" stroke-dasharray="4 8"/>

  <!-- Inner orbit ring -->
  <ellipse cx="140" cy="100" rx="80" ry="55" fill="none" stroke="url(#ring2)" stroke-width="0.5" stroke-dasharray="3 6"/>

  <!-- Central glow orb -->
  <circle cx="140" cy="100" r="50" fill="url(#orbGrad)" opacity="0.5"/>
  <circle cx="140" cy="100" r="25" fill="url(#orbGrad)" opacity="0.7"/>

  <!-- V logo in center -->
  <path d="M122 72L136 128L140 116L144 128L158 72" stroke="url(#vLine)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)"/>

  <!-- Floating particles -->
  <circle cx="60" cy="60" r="2" fill="#7c3aed" opacity="0.6"/>
  <circle cx="220" cy="140" r="1.5" fill="#06b6d4" opacity="0.5"/>
  <circle cx="240" cy="55" r="1" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="40" cy="130" r="1.5" fill="#06b6d4" opacity="0.3"/>
  <circle cx="180" cy="30" r="1" fill="#7c3aed" opacity="0.5"/>
  <circle cx="100" cy="170" r="1.5" fill="#8b5cf6" opacity="0.4"/>

  <!-- Orbit dots -->
  <circle cx="260" cy="100" r="3" fill="#06b6d4" opacity="0.8" filter="url(#cyanGlow)"/>
  <circle cx="20" cy="100" r="2" fill="#7c3aed" opacity="0.6"/>
  <circle cx="140" cy="20" r="2.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="140" cy="180" r="2" fill="#06b6d4" opacity="0.4"/>
</svg>
